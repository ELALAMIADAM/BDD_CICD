# To execute this docker compose yml file use `docker compose -f docker-compose-v3-beta-channel.yml up`
# Add the `-d` flag at the end for detached execution
# To stop the execution, hit Ctrl+C, and then `docker compose -f docker-compose-v3-beta-channel.yml down`
# cest une paplication qui supporte plusirs navigateurs 
services:
  chrome:
    image: selenium/node-chrome:beta
    shm_size: 2gb #memoire partagé a l'interirur de docker 
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub

  edge:
    image: selenium/node-edge:beta
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub

  firefox:
    image: selenium/node-firefox:beta
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub

  selenium-hub: # centrale qui va controler tout les autees navig
    image: selenium/hub:latest
    container_name: selenium-hub
    ports:
      - "4442:4442" #hub (point centrale)interne communique avec les nodes (navigateurs):jai un nv test a executer
      - "4443:4443" # les nodes comminiquer aec le hub : je suis pret pour recevoir des test a executer
      - "4444:4444"
